# ~/.config/xdg-desktop-portal/hyprland-portals.conf — which portal backend
# answers in the Hyprland session (XDG_CURRENT_DESKTOP=Hyprland). Screen
# sharing and screenshots for other programs go to Hyprland's own backend,
# everything else (file pickers, the colour scheme) to GTK's, as in the X
# sessions (fanshell-qs's portals.conf).

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
